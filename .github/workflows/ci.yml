name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all-features

  size:
    # brew/npx/apt/pip all ship this binary, so size is worth watching — but it
    # is a signal, not a gate. A feature worth its bytes should never be blocked
    # by a threshold (docs/PACKAGING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Report binary size
        run: |
          size=$(stat -c%s target/release/ironwire)
          printf 'ironwire: %s bytes (%.1f MB)\n' "$size" "$(echo "$size / 1048576" | bc -l)"
          echo "### ironwire release binary: $((size / 1024)) KB" >> "$GITHUB_STEP_SUMMARY"
